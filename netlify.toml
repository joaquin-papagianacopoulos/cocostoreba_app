# Netlify detecta Next.js y usa su runtime (OpenNext): no subir .next a mano.
# Las variables NEXT_PUBLIC_SUPABASE_* se cargan en Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = ".next"

# Sin esto Netlify subía .next como archivos estáticos (0 functions) y todo daba 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
